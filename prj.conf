# UART0 (console, via USB OpenSDA) em 115200 8N1 - definido no devicetree da placa
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048

# LED RGB: PWM (TPM) se o overlay definir os aliases; senao GPIO
CONFIG_GPIO=y
CONFIG_PWM=y

# Opcoes da aplicacao (ver Kconfig)
CONFIG_APP_ID_DISPOSITIVO=0xa5
CONFIG_APP_CHECK_CRC8=y
CONFIG_APP_TIMEOUT_BYTE_MS=50
